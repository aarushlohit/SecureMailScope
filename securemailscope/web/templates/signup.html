<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — SecureMailScope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-app, #F8FAFC);
      font-family: var(--font-sans, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(15, 23, 42, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .auth-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary, #64748B);
      text-decoration: none;
      margin-bottom: 20px;
      transition: color var(--transition-fast, 0.15s ease);
    }
    .back-home-link:hover {
      color: #0F172A;
    }

    .auth-card {
      background: #FFFFFF;
      border: 1px solid var(--border-default, #E2E8F0);
      border-radius: var(--radius-xl, 16px);
      padding: 36px 32px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      text-align: left;
    }

    .auth-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .auth-logo {
      width: 38px;
      height: 38px;
      background: #0F172A;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
    }

    .brand-meta-name {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.3px;
      color: #0F172A;
    }

    .brand-meta-sub {
      font-size: 11px;
      color: var(--text-tertiary, #94A3B8);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #0F172A;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-secondary, #64748B);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 12px;
      color: #94A3B8;
      pointer-events: none;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: #F8FAFC;
      border: 1px solid var(--border-default, #CBD5E1);
      border-radius: var(--radius-md, 8px);
      font-size: 13px;
      color: #0F172A;
      outline: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus {
      background: #FFFFFF;
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-password-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .btn-password-toggle:hover {
      color: #0F172A;
    }

    /* Password Strength Meter */
    .strength-meter {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .strength-bar-track {
      width: 100%;
      height: 4px;
      background: #E2E8F0;
      border-radius: 2px;
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.25s ease, background-color 0.25s ease;
    }
    .strength-text {
      font-size: 11px;
      color: var(--text-tertiary, #94A3B8);
      display: flex;
      justify-content: space-between;
    }

    .btn-submit {
      width: 100%;
      padding: 11px 16px;
      background: #0F172A;
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md, 8px);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.1);
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #1E293B;
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary, #64748B);
    }
    .auth-footer a {
      color: #2563EB;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }

    .auth-alert {
      padding: 10px 14px;
      border-radius: var(--radius-md, 8px);
      font-size: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
      animation: alertSlide 0.2s ease-out;
    }
    .auth-alert-error {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
    }
    .auth-alert-success {
      background: #F0FDF4;
      border: 1px solid #86EFAC;
      color: #166534;
    }

    @keyframes alertSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <a href="/" class="back-home-link">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>Back to overview</span>
    </a>

    <div class="auth-card">
      <div class="auth-brand-row">
        <div class="auth-logo">
          <i data-lucide="shield-check" style="width: 20px; height: 20px;"></i>
        </div>
        <div>
          <div class="brand-meta-name">SECUREMAILSCOPE</div>
          <div class="brand-meta-sub">Cryptographic Forensics</div>
        </div>
      </div>

      <h1 class="auth-title">Create your analyst account</h1>
      <p class="auth-subtitle">Join the cryptographic email forensic platform to analyze network traffic.</p>

      <div id="signup-alert" class="auth-alert auth-alert-error" style="display:none;">
        <i data-lucide="alert-circle" style="width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px;"></i>
        <span id="signup-alert-text"></span>
      </div>

      <form id="signup-form" onsubmit="handleSignup(event);">
        <div class="form-group">
          <label class="form-label" for="fullname">Full Name</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon" style="width: 14px; height: 14px;"></i>
            <input type="text" id="fullname" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon" style="width: 14px; height: 14px;"></i>
            <input type="email" id="email" class="form-input" placeholder="alex.morgan@agency.gov" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon" style="width: 14px; height: 14px;"></i>
            <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" required oninput="evaluatePasswordStrength(this.value)" autocomplete="new-password">
            <button type="button" class="btn-password-toggle" onclick="togglePasswordVisibility('password', this)" title="Toggle password visibility">
              <i data-lucide="eye" style="width: 14px; height: 14px;"></i>
            </button>
          </div>
          <div class="strength-meter">
            <div class="strength-bar-track">
              <div id="strength-bar" class="strength-bar-fill"></div>
            </div>
            <div class="strength-text">
              <span id="strength-label">Password strength</span>
              <span>Min. 8 characters</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon" style="width: 14px; height: 14px;"></i>
            <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
          </div>
        </div>

        <div style="display: flex; align-items: flex-start; gap: 8px; margin: 16px 0 10px;">
          <input type="checkbox" id="terms" checked required style="accent-color: #0F172A; margin-top: 3px;">
          <label for="terms" style="font-size: 12px; color: var(--text-secondary, #64748B); line-height: 1.4;">
            I agree to the <a href="/app/docs" target="_blank" style="color: #2563EB; text-decoration: underline;">Evidence Integrity Terms</a> and Authorized SOC Security Use Policy.
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          <span>Create account</span>
          <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign in &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" style="width: 14px; height: 14px;"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" style="width: 14px; height: 14px;"></i>';
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function evaluatePasswordStrength(val) {
      const bar = document.getElementById('strength-bar');
      const label = document.getElementById('strength-label');
      if (!val) {
        bar.style.width = '0%';
        bar.style.backgroundColor = '#E2E8F0';
        label.innerText = 'Password strength';
        label.style.color = '#94A3B8';
        return;
      }

      let score = 0;
      if (val.length >= 8) score += 25;
      if (val.length >= 12) score += 25;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
      if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 25;

      bar.style.width = `${score}%`;

      if (score <= 25) {
        bar.style.backgroundColor = '#EF4444';
        label.innerText = 'Weak password';
        label.style.color = '#EF4444';
      } else if (score <= 75) {
        bar.style.backgroundColor = '#F59E0B';
        label.innerText = 'Moderate strength';
        label.style.color = '#F59E0B';
      } else {
        bar.style.backgroundColor = '#10B981';
        label.innerText = 'Strong password';
        label.style.color = '#10B981';
      }
    }

    async function handleSignup(e) {
      if (e) e.preventDefault();
      const alertEl = document.getElementById('signup-alert');
      const alertText = document.getElementById('signup-alert-text');
      const btn = document.getElementById('submit-btn');

      alertEl.style.display = 'none';

      const full_name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alertText.innerText = 'Passwords do not match. Please verify.';
        alertEl.style.display = 'flex';
        return;
      }

      if (password.length < 8) {
        alertText.innerText = 'Password must contain at least 8 characters.';
        alertEl.style.display = 'flex';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span>Creating account...</span>`;

      try {
        const resp = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password })
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || 'Account registration failed.');
        }

        // Save token and user details to localStorage
        localStorage.setItem('securemailscope_token', data.token);
        localStorage.setItem('securemailscope_user', JSON.stringify(data));

        btn.innerHTML = `<span>✓ Account Created &bull; Launching...</span>`;
        btn.style.background = '#059669';

        setTimeout(() => {
          window.location.href = '/app';
        }, 300);
      } catch (err) {
        alertText.innerText = err.message || 'Registration error occurred.';
        alertEl.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = `<span>Create account</span> <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    }
  </script>
</body>
</html>
