<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — SecureMailScope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .auth-card {
      background: #FFFFFF;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      box-shadow: var(--shadow-md);
      text-align: left;
    }

    .auth-logo {
      width: 36px;
      height: 36px;
      background: #000000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      margin-bottom: 24px;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #000000;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: #000000;
      outline: none;
      transition: all var(--transition-fast);
    }
    .form-input:focus {
      background: #FFFFFF;
      border-color: #000000;
      box-shadow: 0 0 0 1px #000000;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-quaternary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }
    .auth-divider span {
      padding: 0 12px;
    }

    .sso-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-sso {
      background: #FFFFFF;
      border: 1px solid var(--border-default);
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-primary);
      transition: all var(--transition-fast);
    }
    .btn-sso:hover {
      background: var(--bg-surface-subtle);
      border-color: var(--border-strong);
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .auth-footer a {
      color: #000000;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <i data-lucide="shield-check" style="width: 20px; height: 20px;"></i>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join the cryptographic email forensic platform.</p>

    <form onsubmit="event.preventDefault(); window.location.href='/app';">
      <div class="form-group">
        <label class="form-label" for="fullname">Full Name</label>
        <input type="text" id="fullname" class="form-input" placeholder="Alex Morgan" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-input" placeholder="alex.morgan@agency.gov" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Minimum 12 characters" required>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 8px; margin: 16px 0 20px;">
        <input type="checkbox" id="terms" checked required style="accent-color: #000; margin-top: 2px;">
        <label for="terms" style="font-size: 12px; color: var(--text-secondary); line-height: 1.4;">
          I agree to the <a href="/app/docs" style="color: #000; text-decoration: underline;">Evidence Integrity Terms</a> and Authorized SOC Use Policy.
        </label>
      </div>

      <button type="submit" class="btn-primary-dark" style="width: 100%; justify-content: center; padding: 11px 16px;">
        Create account &rarr;
      </button>
    </form>

    <div class="auth-divider">
      <span>or continue with</span>
    </div>

    <div class="sso-grid">
      <button type="button" class="btn-sso" onclick="window.location.href='/app';">
        <i data-lucide="key" style="width: 14px; height: 14px;"></i> Enterprise SSO
      </button>
      <button type="button" class="btn-sso" onclick="window.location.href='/app';">
        <i data-lucide="github" style="width: 14px; height: 14px;"></i> GitHub
      </button>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
